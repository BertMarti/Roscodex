<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Roscodex — Completa el rosco</title>
  <desc id="desc">Recreación pixel-art de la pantalla de juego de Roscodex, con cabecera, rosco circular y tarjeta de pregunta.</desc>
  <defs>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#080b17"/><rect y="5" width="8" height="1" fill="#ffffff" opacity=".075"/>
    </pattern>
    <radialGradient id="screenGlow" cx="42%" cy="48%" r="70%">
      <stop offset="0" stop-color="#121e3c"/><stop offset=".58" stop-color="#0a0e1d"/><stop offset="1" stop-color="#080b17"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <style>
      .pixel { font-family: 'Courier New', monospace; font-weight: 900; }
      .tiny { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#screenGlow)"/>
  <g opacity=".18" filter="url(#blur)">
    <rect x="30" y="230" width="260" height="155" rx="20" fill="#a62f47"/>
    <rect x="320" y="230" width="260" height="155" rx="20" fill="#203a82"/>
    <rect x="610" y="230" width="260" height="155" rx="20" fill="#26704e"/>
    <rect x="900" y="230" width="260" height="155" rx="20" fill="#b16b20"/>
  </g>
  <rect width="1200" height="680" fill="url(#scanlines)"/>
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="none" stroke="#171c2e" stroke-width="3"/>

  <g transform="translate(86 66)">
    <circle cx="29" cy="29" r="25" fill="#e74a4a" stroke="#ffcb05" stroke-width="5"/>
    <path d="M7 29h44" stroke="#252737" stroke-width="6"/>
    <circle cx="29" cy="29" r="10" fill="#f5f5f7" stroke="#252737" stroke-width="4"/>
    <circle cx="29" cy="29" r="4" fill="#ffcb05"/>
  </g>
  <text x="143" y="72" fill="#ffcb05" class="tiny" font-size="13">ROSCODEX  //  PRINCIPIANTE</text>
  <text x="143" y="116" fill="#f7f7fa" class="pixel" font-size="34" letter-spacing="1">COMPLETA EL ROSCO</text>
  <text x="144" y="145" fill="#a7acbd" class="tiny" font-size="11">VUELTA 1  ·  LETRA A</text>

  <g transform="translate(975 55)">
    <rect width="115" height="62" rx="9" fill="#0d1020" stroke="#ffcb05" stroke-width="2"/>
    <text x="57" y="20" fill="#ffcb05" class="tiny" font-size="9" text-anchor="middle">TIEMPO</text>
    <text x="57" y="47" fill="#f7f7fa" class="pixel" font-size="20" text-anchor="middle">06:00</text>
  </g>
  <text x="1089" y="145" fill="#ffcb05" class="tiny" font-size="11" text-anchor="end">120 PUNTOS</text>

  <g fill="#f7f7fa" class="pixel" font-size="14" text-anchor="middle">
