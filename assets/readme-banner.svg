    <circle cx="226" cy="239" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="226" y="244">Y</text>
    <circle cx="256" cy="213" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="256" y="218">Z</text>
  </g>

  <g transform="translate(665 205)">
    <rect width="430" height="310" rx="16" fill="#1a1c2a" stroke="#626679" stroke-width="3"/>
    <text x="24" y="34" fill="#a7acbd" class="tiny" font-size="10">DESAFÍO ACTIVO</text>
    <rect x="232" y="17" width="174" height="31" rx="3" fill="#111525" stroke="#ffcb05" stroke-width="2"/>
    <text x="319" y="38" fill="#ffcb05" class="tiny" font-size="9" text-anchor="middle">EMPIEZA POR LA LETRA A</text>
    <text x="215" y="91" fill="#f7f7fa" class="pixel" font-size="17" text-anchor="middle">Empieza por la letra A.</text>
    <text x="215" y="118" fill="#f7f7fa" class="pixel" font-size="17" text-anchor="middle">Es de tipo Agua y Hada.</text>
    <g fill="#111525" stroke="#626679" stroke-width="2">
      <rect x="24" y="147" width="184" height="48" rx="7"/><rect x="222" y="147" width="184" height="48" rx="7"/>
      <rect x="24" y="207" width="184" height="48" rx="7"/><rect x="222" y="207" width="184" height="48" rx="7"/>
    </g>
    <g fill="#f7f7fa" font-family="Arial, sans-serif" font-size="13"><text x="38" y="176">Alakazam</text><text x="236" y="176">Azumarill</text><text x="38" y="236">Arcanine</text><text x="236" y="236">Abra</text></g>
    <rect x="24" y="270" width="382" height="25" rx="5" fill="#182342" stroke="#5874ff" stroke-width="2"/>
    <text x="215" y="288" fill="#9fb1ff" class="tiny" font-size="9" text-anchor="middle">↻ PASAPALABRA</text>
  </g>

  <text x="370" y="580" fill="#a7acbd" class="tiny" font-size="10" text-anchor="middle">○ PENDIENTE   ● ACIERTO   ● FALLADA   ● PASADA   ● TIEMPO</text>
  <text x="600" y="635" fill="#35cf78" class="tiny" font-size="13" text-anchor="middle">ROSCODEX · PROYECTO FAN GRATUITO</text>
</svg>
