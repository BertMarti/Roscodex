    <circle cx="370" cy="520" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="370" y="525">O</text>
    <circle cx="330" cy="516" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="330" y="521">P</text>
    <circle cx="291" cy="504" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="291" y="509">Q</text>
    <circle cx="256" cy="485" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="256" y="490">R</text>
    <circle cx="226" cy="459" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="226" y="464">S</text>
    <circle cx="204" cy="426" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="204" y="431">T</text>
    <circle cx="193" cy="389" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="193" y="394">U</text>
    <circle cx="189" cy="349" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="189" y="354">V</text>
    <circle cx="193" cy="309" r="21" fill="#626679" stroke="#5874ff" stroke-width="2"/><text x="193" y="314">W</text>
